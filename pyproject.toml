[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "nichecompass"
version = "0.3.2"
description = "End-to-end analysis of spatial multi-omics data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Sebastian Birk"},
]
maintainers = [
    {name = "Sebastian Birk", email = "sebastian.birk@outlook.com"},
]
urls.Documentation = "https://nichecompass.readthedocs.io/"
urls.Source = "https://github.com/Lotfollahi-lab/nichecompass"
urls.Home-page = "https://github.com/Lotfollahi-lab/nichecompass"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "rdata",
    "scanpy",
    # InducedNeighborSampler overrides the private NeighborSampler._sample.
    # Tested with 2.5 to 2.8. Check it again before raising the upper bound.
    "torch-geometric>=2.5,<2.9",
    "omnipath",
    "decoupler",
    "numpy",
]
optional-dependencies.dev = [
    "pre-commit",
    "twine>=4.0.2",
]
optional-dependencies.docs = [
    "docutils>=0.8,!=0.18.*,!=0.19.*",
    "sphinx>=4.1",
    "sphinx-book-theme>=1.0.0",
    "myst-nb",
    "myst-parser",
    "sphinxcontrib-bibtex>=1.0.0",
    "sphinx-autodoc-typehints",
    "sphinx_rtd_theme",
    "sphinxext-opengraph",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-hoverxref",
    # For notebooks
    "ipykernel",
    "ipython",
    "pandas",
]
optional-dependencies.docsbuild = [
    "nichecompass[docs,benchmarking,multimodal]"
]  # docs build dependencies
# Only needed for tracking with an mlflow_experiment_id.
optional-dependencies.tracking = [
    "mlflow",
]
optional-dependencies.tests = [
    "pytest",
    "coverage",
]
optional-dependencies.benchmarking = [
    "scib-metrics",
    "pynndescent",
    "scikit-misc",
    "squidpy",
    "jax",
    "jaxlib"
]
optional-dependencies.multimodal = [
    "scglue",
]
optional-dependencies.tutorials = [
    "jupyterlab",
]
optional-dependencies.all = ["nichecompass[dev,docs,tests,benchmarking,multimodal,tracking,tutorials]"]

[tool.coverage.run]
source = ["nichecompass"]
omit = [
    "**/test_*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = [
    "--import-mode=importlib",  # allow using test files with same name
]

[tool.ruff]
line-length = 120
src = ["src"]
extend-include = ["*.ipynb"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",  # Errors detected by Pyflakes
    "E",  # Error detected by Pycodestyle
    "W",  # Warning detected by Pycodestyle
    "I",  # isort
    "D",  # pydocstyle
    "B",  # flake8-bugbear
    "TID",  # flake8-tidy-imports
    "C4",  # flake8-comprehensions
    "BLE",  # flake8-blind-except
    "UP",  # pyupgrade
    "RUF100",  # Report unused noqa directives
]
ignore = [
    # line too long -> we accept long comment lines; formatter gets rid of long code lines
    "E501",
    # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
    "E731",
    # allow I, O, l as variable names -> I is the identity matrix
    "E741",
    # Missing docstring in public package
    "D104",
    # Missing docstring in public module
    "D100",
    # Missing docstring in __init__
    "D107",
    # Errors from function calls in argument defaults. These are fine when the result is immutable.
    "B008",
    # __magic__ methods are are often self-explanatory, allow missing docstrings
    "D105",
    # first line should end with a period [Bug: doesn't work with single-line docstrings]
    "D400",
    # First line should be in imperative mood; try rephrasing
    "D401",
    ## Disable one in each pair of mutually incompatible rules
    # We don’t want a blank line before a class docstring
    "D203",
    # We want docstrings to start immediately after the opening triple quote
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["I"]
"tests/*" = ["D"]
"*/__init__.py" = ["F401"]

[tool.cruft]
skip = [
    "tests",
    "src/**/__init__.py",
    "src/**/basic.py",
    "docs/api.md",
    "docs/changelog.md",
    "docs/references.bib",
    "docs/references.md",
    "docs/notebooks/example.ipynb",
]

# CI test environment. PyTorch and pyg-lib are not package dependencies, because users install the
# build that matches their CUDA version (see docs/installation.md). The PyG wheel index publishes
# no hashes, so the pyg-lib wheel is a direct URL, which uv hashes in the lock file.
[dependency-groups]
ci = [
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'",
    # InducedNeighborSampler needs pyg-lib or torch-sparse.
    "pyg-lib==0.8.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'",
    "numpy==1.26.4; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'",
    "scipy==1.10.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'",
]
# Build backend for "uv build --no-build-isolation" and twine, so that CI builds and checks with locked versions.
build = [
    "hatchling",
    "twine",
]

[tool.uv]
# Wait 5 days before taking a new release, same as the Renovate cooldown
exclude-newer = "5 days"
# A Renovate security fix PR skips the Renovate cooldown, but not this one. To take a fix that
# is younger than 5 days, list the package here and run
# uv lock --upgrade-package '<package>==<fixed version>'. A plain uv lock keeps the locked
# version. Remove the entry when the version is older than 5 days.
# Example: exclude-newer-package = { idna = false }

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
pyg-lib = { url = "https://data.pyg.org/whl/torch-2.13.0%2Bcpu/pyg_lib-0.8.0%2Bpt213cpu-cp310-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
